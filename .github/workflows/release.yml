name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish, without the v prefix'
        required: true
        default: '1.2.0'
        type: string
      manual_gates_confirmed:
        description: 'I completed all manual release gates recorded in CHECKLIST.md'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Confirm release target
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          MANUAL_GATES_CONFIRMED: ${{ inputs.manual_gates_confirmed }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"

          PACKAGE_VERSION="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('package.json','utf8')).version)")"
          test "$REQUESTED_VERSION" = "$PACKAGE_VERSION"
          test "$MANUAL_GATES_CONFIRMED" = "true"

          git fetch origin master --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"

          TAG="v$PACKAGE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "$TAG already exists locally."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run full release gate
        run: npm run validate:all

      - name: Require completed manual gates and stable docs
        run: npm run validate:publish

      - name: Publish tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('package.json','utf8')).version)")"
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
            exit 1
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Weapon Reinforce $VERSION" \
            --notes-file "docs/releases/$TAG.md"

          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url
