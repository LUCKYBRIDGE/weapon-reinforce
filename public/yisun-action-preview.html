<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이순신 콤보 동작 미리보기</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #111318;
        color: #f4f1e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 30% 20%, rgba(93, 116, 92, 0.18), transparent 34rem),
          linear-gradient(135deg, #141512 0%, #1b1a16 48%, #101217 100%);
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 32px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .status {
        color: #cfc6a5;
        font-size: 13px;
      }

      .stage {
        display: grid;
        grid-template-columns: minmax(300px, 1fr) 310px;
        gap: 18px;
        align-items: start;
      }

      .viewer,
      .panel,
      .strip {
        border: 1px solid rgba(231, 213, 163, 0.18);
        background: rgba(12, 13, 14, 0.72);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      }

      .viewer {
        display: grid;
        place-items: center;
        min-height: 560px;
        padding: 28px;
      }

      .frame-stage {
        position: relative;
        display: grid;
        place-items: center;
        width: min(68vh, 620px, 100%);
        aspect-ratio: 1;
        overflow: hidden;
        background:
          linear-gradient(45deg, rgba(255, 255, 255, 0.045) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(255, 255, 255, 0.045) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.045) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.045) 75%),
          #2b2d30;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0;
        background-size: 20px 20px;
      }

      .frame-stage::before {
        content: "";
        position: absolute;
        inset: 10%;
        border: 1px dashed rgba(255, 255, 255, 0.18);
        pointer-events: none;
      }

      .frame-stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .onion {
        opacity: 0;
        filter: hue-rotate(165deg) saturate(1.4);
        transition: opacity 120ms ease;
      }

      body.show-onion .onion {
        opacity: 0.32;
      }

      .current-frame {
        z-index: 1;
      }

      .panel {
        padding: 18px;
      }

      .panel h2 {
        margin: 0 0 14px;
        font-size: 18px;
      }

      .control-group {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
      }

      .control-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .control-row.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      button {
        min-height: 42px;
        border: 1px solid rgba(238, 218, 162, 0.3);
        background: rgba(255, 255, 255, 0.07);
        color: #f8f0dc;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button:hover,
      button[aria-pressed="true"] {
        border-color: #f4c85f;
        background: rgba(244, 200, 95, 0.18);
      }

      label {
        display: grid;
        gap: 8px;
        color: #cfc6a5;
        font-size: 13px;
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
      }

      .readout {
        display: grid;
        gap: 6px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.055);
        color: #ddd4b7;
        font-size: 13px;
        line-height: 1.45;
      }

      .readout strong {
        color: #fff4d3;
      }

      .strip {
        margin-top: 18px;
        padding: 12px;
        overflow: auto;
      }

      .thumbs {
        display: grid;
        grid-template-columns: repeat(12, 88px);
        gap: 8px;
        min-width: max-content;
      }

      .thumb {
        display: grid;
        gap: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 4px;
        background: rgba(255, 255, 255, 0.045);
        cursor: pointer;
      }

      .thumb.active {
        border-color: #f4c85f;
        background: rgba(244, 200, 95, 0.18);
      }

      .thumb img {
        width: 78px;
        height: 78px;
        object-fit: contain;
        image-rendering: pixelated;
        background: #2b2d30;
      }

      .thumb span {
        min-height: 28px;
        color: #d6cfba;
        font-size: 10px;
        line-height: 1.2;
        text-align: center;
      }

      @media (max-width: 840px) {
        header,
        .stage {
          display: block;
        }

        .viewer {
          min-height: auto;
          margin-bottom: 14px;
          padding: 16px;
        }

        .frame-stage {
          width: min(92vw, 520px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>이순신 콤보 동작 미리보기</h1>
        <div class="status" id="status">불러오는 중</div>
      </header>

      <section class="stage">
        <div class="viewer">
          <div class="frame-stage" aria-label="애니메이션 프레임">
            <img class="onion" id="prevFrame" alt="" />
            <img class="current-frame" id="currentFrame" alt="현재 프레임" />
          </div>
        </div>

        <aside class="panel">
          <h2>재생 제어</h2>
          <div class="control-group">
            <div class="control-row">
              <button id="oneHanded" type="button" aria-pressed="true">한손무기</button>
              <button id="twoHanded" type="button" aria-pressed="false">두손무기</button>
            </div>
            <div class="control-row">
              <button id="playPause" type="button">일시정지</button>
              <button id="step" type="button">한 컷 보기</button>
            </div>
            <button id="onionToggle" type="button" aria-pressed="false">이전 컷 잔상 보기</button>
          </div>

          <div class="control-group">
            <div class="control-row three">
              <button id="timingAttack" type="button" aria-pressed="true">공격 타이밍</button>
              <button id="timingEven" type="button" aria-pressed="false">균등 재생</button>
              <button id="timingInspect" type="button" aria-pressed="false">느린 검수</button>
            </div>
          </div>

          <div class="control-group">
            <label id="fpsControl">
              재생 속도 <span id="fpsLabel">10 FPS</span>
              <input id="fps" type="range" min="4" max="18" step="1" value="10" />
            </label>
            <label>
              표시 크기 <span id="scaleLabel">100%</span>
              <input id="scale" type="range" min="70" max="130" step="5" value="100" />
            </label>
          </div>

          <div class="readout">
            <div><strong id="setName">한손무기</strong></div>
            <div id="frameName">프레임 1</div>
            <div id="frameNote">예비동작, 타격, 팔로스루의 흐름을 확인하세요.</div>
          </div>
        </aside>
      </section>

      <section class="strip">
        <div class="thumbs" id="thumbs"></div>
      </section>
    </main>

    <script>
      const manifestUrl = "images/yisun_actions/manifest.json";
      const frameNotes = {
        slash_a_anticipation: "첫 베기 예비동작. 무기를 위로 들고 몸을 압축합니다.",
        slash_a_contact: "첫 베기 타격. 이펙트가 무기 궤적에 붙어야 합니다.",
        slash_a_followthrough: "첫 베기 팔로스루. 무기와 몸 중심이 자연스럽게 내려옵니다.",
        transition_a_to_b: "찌르기 준비 연결동작.",
        thrust_b_anticipation: "찌르기 예비동작. 무기 끝 방향을 확인합니다.",
        thrust_b_contact: "찌르기 타격. 이펙트가 무기 끝에서 시작해야 합니다.",
        thrust_b_followthrough: "찌르기 팔로스루. 몸 중심이 앞으로 갔다가 정리됩니다.",
        transition_b_to_c: "두 번째 베기 준비 연결동작.",
        slash_c_anticipation: "두 번째 베기 예비동작.",
        slash_c_contact: "두 번째 베기 타격. 이펙트 위치와 크기를 확인합니다.",
        slash_c_followthrough: "두 번째 베기 팔로스루.",
        loop_lift_recovery: "루프 복귀. 첫 컷으로 돌아갈 준비 자세입니다.",
      };

      const state = {
        manifest: null,
        set: "oneHanded",
        frame: 0,
        playing: true,
        fps: 10,
        timingMode: "attack",
        frameStartedAt: 0,
        lastTime: 0,
      };

      const fallbackFrameDurations = {
        attack: [150, 55, 120, 95, 130, 45, 95, 105, 150, 55, 120, 110],
        inspect: [
          420,
          300,
          360,
          320,
          420,
          300,
          360,
          320,
          420,
          300,
          360,
          340,
        ],
      };

      const els = {
        status: document.getElementById("status"),
        currentFrame: document.getElementById("currentFrame"),
        prevFrame: document.getElementById("prevFrame"),
        oneHanded: document.getElementById("oneHanded"),
        twoHanded: document.getElementById("twoHanded"),
        playPause: document.getElementById("playPause"),
        step: document.getElementById("step"),
        onionToggle: document.getElementById("onionToggle"),
        timingAttack: document.getElementById("timingAttack"),
        timingEven: document.getElementById("timingEven"),
        timingInspect: document.getElementById("timingInspect"),
        fps: document.getElementById("fps"),
        fpsControl: document.getElementById("fpsControl"),
        fpsLabel: document.getElementById("fpsLabel"),
        scale: document.getElementById("scale"),
        scaleLabel: document.getElementById("scaleLabel"),
        setName: document.getElementById("setName"),
        frameName: document.getElementById("frameName"),
        frameNote: document.getElementById("frameNote"),
        thumbs: document.getElementById("thumbs"),
      };

      function combo() {
        return state.manifest.sets[state.set].comboChain.frames;
      }

      function animationMeta() {
        const key = state.set === "oneHanded" ? "oneHandedCombo" : "twoHandedCombo";
        return state.manifest.phaser?.animations?.[key] || null;
      }

      function currentAttackDurations() {
        return animationMeta()?.durations || fallbackFrameDurations.attack;
      }

      function setFrame(index) {
        const frames = combo();
        state.frame = (index + frames.length) % frames.length;
        const previous = (state.frame + frames.length - 1) % frames.length;
        const frame = frames[state.frame];
        els.currentFrame.src = frame.file;
        els.prevFrame.src = frames[previous].file;
        els.setName.textContent = state.set === "oneHanded" ? "한손무기" : "두손무기";
        els.frameName.textContent = `${String(state.frame + 1).padStart(2, "0")} / ${frames.length} · ${frame.key}`;
        els.frameNote.textContent = frameNotes[frame.key] || "동작 연결을 확인하세요.";
        [...els.thumbs.children].forEach((thumb, thumbIndex) => {
          thumb.classList.toggle("active", thumbIndex === state.frame);
        });
      }

      function setTimingMode(mode) {
        state.timingMode = mode;
        state.frameStartedAt = performance.now();
        els.timingAttack.setAttribute("aria-pressed", String(mode === "attack"));
        els.timingEven.setAttribute("aria-pressed", String(mode === "even"));
        els.timingInspect.setAttribute("aria-pressed", String(mode === "inspect"));
        els.fpsControl.style.opacity = mode === "even" ? "1" : "0.48";
      }

      function renderThumbs() {
        els.thumbs.textContent = "";
        combo().forEach((frame, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "thumb";
          button.innerHTML = `<img alt="" src="${frame.file}" /><span>${index + 1}<br>${frame.key.replaceAll("_", " ")}</span>`;
          button.addEventListener("click", () => {
            state.playing = false;
            els.playPause.textContent = "재생";
            setFrame(index);
          });
          els.thumbs.appendChild(button);
        });
      }

      function setSet(nextSet) {
        state.set = nextSet;
        els.oneHanded.setAttribute("aria-pressed", String(nextSet === "oneHanded"));
        els.twoHanded.setAttribute("aria-pressed", String(nextSet === "twoHanded"));
        state.frame = 0;
        renderThumbs();
        setFrame(0);
      }

      function tick(time) {
        if (state.playing) {
          const duration =
            state.timingMode === "even"
              ? 1000 / state.fps
              : state.timingMode === "attack"
                ? currentAttackDurations()[state.frame]
                : fallbackFrameDurations.inspect[state.frame];
          if (time - state.frameStartedAt >= duration) {
            state.frameStartedAt = time;
            state.lastTime = time;
            setFrame(state.frame + 1);
          }
        }
        requestAnimationFrame(tick);
      }

      async function init() {
        const response = await fetch(manifestUrl);
        state.manifest = await response.json();
        els.status.textContent = state.manifest.status;
        setSet("oneHanded");
        requestAnimationFrame(tick);
      }

      els.oneHanded.addEventListener("click", () => setSet("oneHanded"));
      els.twoHanded.addEventListener("click", () => setSet("twoHanded"));
      els.playPause.addEventListener("click", () => {
        state.playing = !state.playing;
        els.playPause.textContent = state.playing ? "일시정지" : "재생";
        state.frameStartedAt = performance.now();
      });
      els.step.addEventListener("click", () => {
        state.playing = false;
        els.playPause.textContent = "재생";
        setFrame(state.frame + 1);
      });
      els.onionToggle.addEventListener("click", () => {
        const enabled = !document.body.classList.contains("show-onion");
        document.body.classList.toggle("show-onion", enabled);
        els.onionToggle.setAttribute("aria-pressed", String(enabled));
      });
      els.fps.addEventListener("input", () => {
        state.fps = Number(els.fps.value);
        els.fpsLabel.textContent = `${state.fps} FPS`;
      });
      els.timingAttack.addEventListener("click", () => setTimingMode("attack"));
      els.timingEven.addEventListener("click", () => setTimingMode("even"));
      els.timingInspect.addEventListener("click", () => setTimingMode("inspect"));
      els.scale.addEventListener("input", () => {
        const scale = Number(els.scale.value);
        els.scaleLabel.textContent = `${scale}%`;
        els.currentFrame.style.transform = `scale(${scale / 100})`;
        els.prevFrame.style.transform = `scale(${scale / 100})`;
      });

      setTimingMode("attack");

      init().catch((error) => {
        els.status.textContent = `불러오기 실패: ${error.message}`;
      });
    </script>
  </body>
</html>
